<!DOCTYPE html>
<html lang="en">
<head>

        <div id="popup" class="inactive">

                </div>

        </div>
        <!-- // main page content // -->
        <div id="wrapper">
            <!-- // bio elements // -->
            <div class="profile" id="profile">

            </div>

            </div>
            <div class="about" id="about">

            </div>

            <div class="links" id="links">

            </div>
