<!DOCTYPE html>
<html lang="en">
<!-- TAKEN FROM https://github.com/h-kuwayama/ghp-rewrite/blob/gh-pages/404.html -->
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Github Pages Rewrite</title>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/main.css">

    <script>
    /*
    * Config
    */
    let redirect_file_name = 'index.html';
    let parameter_key = 'display';
        
    /*
    * Env
    */
    let path_name = window.location.pathname;
        
    /*
    * Process
    * (Redirect)
    */
    let match_condition = new RegExp(redirect_file_name.replace('.html', '') + '/[a-z0-9-_]+$');
    if (permalink = path_name.match(match_condition)) 
    {
        location.href = path_name.replace(permalink, '') + redirect_file_name + '?' + parameter_key + '=' + permalink[0].replace(/post\//, '');
    }
    </script>
</head>
<body>
  <h1>Github Pages Rewrite</h1>
  <h2>404 Not Found.</h2>
</body>
</html>
